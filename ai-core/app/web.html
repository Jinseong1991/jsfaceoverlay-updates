<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Core</title>
<style>
  :root { --bg:#fafaf9; --fg:#1c1917; --muted:#78716c; --me:#e7e5e4; --line:#d6d3d1; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1917; --fg:#f5f5f4; --muted:#a8a29e; --me:#292524; --line:#44403c; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui, sans-serif; }
  main { max-width:760px; margin:0 auto; padding:16px; display:flex; flex-direction:column; height:100dvh; }
  #log { flex:1; overflow-y:auto; }
  .msg { white-space:pre-wrap; padding:10px 14px; margin:8px 0; border-radius:12px; }
  .me { background:var(--me); margin-left:15%; }
  .ai { border:1px solid var(--line); margin-right:15%; }
  form { display:flex; gap:8px; padding-top:8px; }
  textarea { flex:1; resize:none; font:inherit; padding:10px; border-radius:10px; border:1px solid var(--line); background:transparent; color:inherit; }
  button { font:inherit; padding:0 18px; border-radius:10px; border:0; background:var(--fg); color:var(--bg); cursor:pointer; }
  .hint { color:var(--muted); font-size:14px; }
</style>
</head>
<body>
<main>
  <div id="log"><p class="hint">주인 전용입니다. 처음 메시지를 보낼 때 OWNER_TOKEN을 물어봅니다.</p></div>
  <form id="f">
    <textarea id="t" rows="2" placeholder="말 걸기 (Enter 전송, Shift+Enter 줄바꿈)"></textarea>
    <button>보내기</button>
  </form>
</main>
<script>
const log = document.getElementById("log"), t = document.getElementById("t");
function token() {
  let v = null;
  try { v = localStorage.getItem("owner_token"); } catch (e) {}
  if (!v) { v = prompt("OWNER_TOKEN"); try { localStorage.setItem("owner_token", v); } catch (e) {} }
  return v;
}
function add(cls, text) {
  const d = document.createElement("div"); d.className = "msg " + cls; d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}
async function send(text) {
  add("me", text);
  const out = add("ai", "…");
  const r = await fetch("/chat", { method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token() },
    body: JSON.stringify({ message: text }) });
  if (r.status === 401) { try { localStorage.removeItem("owner_token"); } catch (e) {} out.textContent = "토큰이 틀렸어요. 다시 보내면 새로 물어봅니다."; return; }
  if (!r.ok) { out.textContent = "오류: " + r.status; return; }
  const reader = r.body.getReader(), dec = new TextDecoder(); out.textContent = "";
  for (;;) { const { done, value } = await reader.read(); if (done) break;
    out.textContent += dec.decode(value, { stream: true }); log.scrollTop = log.scrollHeight; }
}
document.getElementById("f").onsubmit = e => { e.preventDefault(); const v = t.value.trim(); if (v) { t.value = ""; send(v); } };
t.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("f").requestSubmit(); } };
</script>
</body>
</html>
