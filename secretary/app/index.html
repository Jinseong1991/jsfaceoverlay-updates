<title>내 비서</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@600&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
  /* Layout: one-column phone app. Sticky header, scrolling body, fixed bottom tab bar. */
  :root {
    --bg: #f4f6f8;
    --surface: #ffffff;
    --fg: #1a1d22;
    --muted: #5d6673;
    --line: #dde2e8;
    --accent: #0c6b5e;
    --accent-ink: #ffffff;
    --accent-soft: #d8efe9;
    --warn: #a3520b;
    --warn-soft: #f9e8d4;
    --bad: #9b2c2c;
    --bad-soft: #f8dede;
    --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    --font-display: "Noto Serif KR", "Apple SD Gothic Neo", serif;
    --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121418; --surface: #1b1e24; --fg: #e8eaed; --muted: #9aa3ae; --line: #2c313a;
      --accent: #4fbfae; --accent-ink: #0d1a17; --accent-soft: #173330;
      --warn: #e4a35d; --warn-soft: #3a2a16; --bad: #e07a7a; --bad-soft: #3c1f1f;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121418; --surface: #1b1e24; --fg: #e8eaed; --muted: #9aa3ae; --line: #2c313a;
    --accent: #4fbfae; --accent-ink: #0d1a17; --accent-soft: #173330;
    --warn: #e4a35d; --warn-soft: #3a2a16; --bad: #e07a7a; --bad-soft: #3c1f1f;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
  * { box-sizing: border-box; }
  button { font: inherit; color: inherit; }
  .app { min-height: 100%; display: flex; flex-direction: column; padding-bottom: calc(68px + env(safe-area-inset-bottom, 0px)); }
  header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding: 14px 16px 10px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); }
  header.top h1 { margin: 0; font-family: var(--font-display); font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  header.top .date { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  main { padding-block: 14px 24px; padding-inline: 16px; display: flex; flex-direction: column; gap: 14px; }
  .status { font-size: 12px; color: var(--muted); font-family: var(--font-mono); }
  .notice { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
  .empty { color: var(--muted); font-size: 14px; padding: 18px 4px; text-align: center; }
  section h2 { margin: 0 0 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .brief { font-family: var(--font-display); font-size: 17px; line-height: 1.55; text-wrap: balance; margin: 0; }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; min-width: 0; }
  .card .title { font-weight: 600; font-size: 16px; margin: 0 0 4px; text-wrap: balance; }
  .card .why { color: var(--muted); font-size: 14px; margin: 0 0 6px; }
  .card .action { font-size: 14px; margin: 0; }
  .card .action::before { content: "→ "; color: var(--accent); }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-size: 14px; cursor: pointer; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .btn.danger { color: var(--bad); }
  .btn[disabled] { opacity: 0.5; cursor: default; }
  .pill { display: inline-block; font-size: 11px; font-family: var(--font-mono); padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); vertical-align: middle; }
  .pill.medium { background: var(--warn-soft); color: var(--warn); }
  .pill.low { background: var(--line); color: var(--muted); }
  .pill.done { background: var(--line); color: var(--muted); }
  .pill.declined { background: var(--bad-soft); color: var(--bad); }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  /* 기록 */
  .moods { display: flex; flex-wrap: wrap; gap: 8px; }
  .mood { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 12px; font-size: 14px; cursor: pointer; }
  .mood[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  textarea, select { width: 100%; font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  textarea { min-height: 96px; resize: vertical; }
  textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > select { flex: 1; min-width: 0; }
  .log { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; }
  .log .m { font-size: 20px; line-height: 1; padding-top: 2px; }
  .log p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  /* 프로필 */
  .rules { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
  details.cat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
  details.cat summary { cursor: pointer; padding: 12px 14px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; list-style: none; }
  details.cat summary::-webkit-details-marker { display: none; }
  details.cat summary .n { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
  details.cat[open] summary { border-bottom: 1px solid var(--line); }
  .pref { padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .pref:last-child { border-bottom: 0; }
  .pref .s { margin: 0 0 4px; }
  .pref.rejected .s { text-decoration: line-through; color: var(--muted); }
  .pref blockquote { margin: 6px 0 0; padding-left: 10px; border-left: 2px solid var(--line); color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  .pref .btns { margin-top: 8px; }
  .pref .btn { padding: 5px 11px; font-size: 13px; }
  /* 탭바 */
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); display: flex; padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 6; }
  nav.tabs button { flex: 1; border: 0; background: none; padding: 10px 4px 8px; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; }
  nav.tabs button .ic { font-size: 20px; line-height: 1; }
  nav.tabs button[aria-selected="true"] { color: var(--accent); font-weight: 600; }
  nav.tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .badge { position: relative; }
  .badge[data-n]:not([data-n="0"])::after { content: attr(data-n); position: absolute; top: 4px; right: calc(50% - 22px); background: var(--accent); color: var(--accent-ink); font-size: 10px; font-family: var(--font-mono); padding: 1px 5px; border-radius: 999px; }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 999px; font-size: 13px; z-index: 7; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
  @media (min-width: 640px) { main { max-width: 560px; width: 100%; margin: 0 auto; } header.top { max-width: 560px; margin: 0 auto; } nav.tabs { max-width: 560px; margin: 0 auto; border-left: 1px solid var(--line); border-right: 1px solid var(--line); } }
</style>

<div class="app">
  <header class="top">
    <h1>내 비서</h1>
    <span class="date" id="today"></span>
  </header>
  <main id="main"></main>
</div>
<nav class="tabs" aria-label="탭">
  <button type="button" id="tab-today" class="badge" data-n="0" aria-selected="true"><span class="ic">☀</span>오늘</button>
  <button type="button" id="tab-log" aria-selected="false"><span class="ic">✎</span>기록</button>
  <button type="button" id="tab-profile" aria-selected="false"><span class="ic">◎</span>프로필</button>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  const MOODS = [["😊", "좋음"], ["😐", "보통"], ["😩", "피곤"], ["😤", "답답"], ["🔥", "급함"], ["🙂", "만족"]];
  const CATS = ["일상", "감정", "선호", "비선호", "관심사", "작업습관"];
  const state = {
    db: null, uid: null, dbState: "loading", tab: "today",
    profile: null, suggestions: [], briefs: [], logs: [], feedback: {},
    draft: { mood: null, category: "일상", text: "" }, busy: new Set(),
  };
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const nowIso = () => new Date().toISOString().replace(/\.\d{3}Z$/, "Z");
  const KST = "Asia/Seoul";
  function todayStr() {
    const d = new Date();
    return new Intl.DateTimeFormat("sv-SE", { timeZone: KST, year: "numeric", month: "2-digit", day: "2-digit" }).format(d);
  }
  function fmtWhen(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    if (isNaN(d)) return esc(iso);
    return new Intl.DateTimeFormat("ko-KR", { timeZone: KST, month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false }).format(d);
  }
  let toastTimer = null;
  function toast(msg) {
    const t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
  }
  try { const saved = localStorage.getItem("secretary.tab"); if (saved === "today" || saved === "log" || saved === "profile") state.tab = saved; } catch (e) {}

  // ---------- render ----------
  function render() {
    $("today").textContent = new Intl.DateTimeFormat("ko-KR", { timeZone: KST, month: "long", day: "numeric", weekday: "short" }).format(new Date());
    for (const t of ["today", "log", "profile"]) $("tab-" + t).setAttribute("aria-selected", String(state.tab === t));
    $("tab-today").dataset.n = String(state.suggestions.filter((s) => s.status === "pending").length);
    const main = $("main");
    let html = "";
    if (state.dbState === "none") html += '<div class="notice">claude.ai에 로그인한 상태로 열어야 기록과 제안이 보입니다.</div>';
    else if (state.dbState === "loading") html += '<div class="status">불러오는 중…</div>';
    html += state.tab === "today" ? renderToday() : state.tab === "log" ? renderLog() : renderProfile();
    main.innerHTML = html;
    bind();
  }
  function renderToday() {
    const today = todayStr();
    const brief = state.briefs.find((b) => b.date === today) || state.briefs[0];
    const pending = state.suggestions.filter((s) => s.status === "pending");
    const rest = state.suggestions.filter((s) => s.status !== "pending").slice(0, 10);
    let h = "";
    h += "<section>";
    if (brief) h += `<p class="brief">${esc(brief.summary)}</p><div class="meta" style="margin-top:6px">${brief.date === today ? "오늘" : esc(brief.date)} 브리핑 · ${fmtWhen(brief.generated_at)}</div>`;
    else if (state.dbState === "ready") h += '<p class="brief">아직 브리핑이 없어요. 매일 아침 비서가 지난 세션과 기록을 읽고 여기에 씁니다.</p>';
    h += "</section>";
    h += `<section><h2>먼저 해줄까요? ${pending.length ? `<span class="pill">${pending.length}</span>` : ""}</h2>`;
    if (!pending.length) h += '<div class="empty">지금은 답을 기다리는 제안이 없어요.</div>';
    h += '<div class="list">';
    for (const s of pending) {
      const busy = state.busy.has(s.id);
      h += `<article class="card" data-id="${esc(s.id)}">
        <p class="title">${esc(s.title)}</p>
        <p class="why">${esc(s.why)}</p>
        <p class="action">${esc(s.action)}</p>
        <div class="btns">
          <button type="button" class="btn primary act" data-status="accepted" ${busy ? "disabled" : ""}>해줘</button>
          <button type="button" class="btn act" data-status="expired" ${busy ? "disabled" : ""}>나중에</button>
          <button type="button" class="btn danger act" data-status="declined" ${busy ? "disabled" : ""}>필요없어</button>
        </div></article>`;
    }
    h += "</div></section>";
    if (rest.length) {
      h += '<section><h2>지난 제안</h2><div class="list">';
      for (const s of rest) {
        const label = { accepted: "하는 중", done: "완료", declined: "거절", expired: "보류" }[s.status] || s.status;
        h += `<article class="card"><p class="title">${esc(s.title)} <span class="pill ${esc(s.status)}">${label}</span></p>${s.note ? `<p class="why">${esc(s.note)}</p>` : ""}<div class="meta">${fmtWhen(s.resolved_at || s.created_at)}</div></article>`;
      }
      h += "</div></section>";
    }
    return h;
  }
  function renderLog() {
    const d = state.draft;
    let h = '<section><h2>지금 어때요?</h2><div class="moods">';
    for (const [e, n] of MOODS) h += `<button type="button" class="mood" data-mood="${e} ${n}" aria-pressed="${d.mood === e + " " + n}">${e} ${n}</button>`;
    h += "</div></section>";
    h += `<section><h2>남길 말</h2>
      <div class="row" style="margin-bottom:8px"><label for="log-cat" class="meta">종류</label><select id="log-cat">${CATS.map((c) => `<option ${d.category === c ? "selected" : ""}>${c}</option>`).join("")}</select></div>
      <textarea id="log-text" placeholder="예: 오늘 아침엔 설명 길게 하는 거 짜증났음 / 점심 뭐 먹을지 매번 고민함 / 이번 주 금요일 발표">${esc(d.text)}</textarea>
      <div class="btns"><button type="button" class="btn primary" id="log-save" ${state.dbState !== "ready" ? "disabled" : ""}>저장</button><span class="meta" style="align-self:center">비서가 다음 동기화 때 읽습니다</span></div></section>`;
    h += '<section><h2>최근 기록</h2>';
    if (!state.logs.length) h += '<div class="empty">아직 기록이 없어요. 사소한 것도 좋아요.</div>';
    h += '<div class="list">';
    for (const l of state.logs) h += `<div class="card log"><div class="m">${esc((l.mood || "·").split(" ")[0])}</div><div><p>${esc(l.text)}</p><div class="meta">${esc(l.category || "")} · ${fmtWhen(l.at)}</div></div></div>`;
    h += "</div></section>";
    return h;
  }
  function renderProfile() {
    const p = state.profile;
    let h = "";
    if (!p) return h + '<div class="empty">아직 프로필이 없어요. 첫 동기화가 끝나면 여기에 비서가 파악한 내용이 나옵니다.</div>';
    h += `<section><div class="status">근거 ${p.signal_count || 0}건 · 갱신 ${fmtWhen(p.updated_at)}</div></section>`;
    if (p.rules && p.rules.length) h += `<section><h2>비서가 지키는 규칙</h2><ul class="rules">${p.rules.map((r) => `<li>${esc(r)}</li>`).join("")}</ul></section>`;
    h += '<section><h2>비서가 파악한 것</h2><div class="list">';
    for (const c of p.categories || []) {
      h += `<details class="cat" ${state.openCat === c.name ? "open" : ""} data-cat="${esc(c.name)}"><summary>${esc(c.name)}<span class="n">${c.items.length}</span></summary>`;
      for (const it of c.items) {
        const fb = state.feedback[it.id];
        const rejected = it.status === "rejected" || (fb && fb.verdict === "wrong");
        const quote = it.quotes && it.quotes.length ? it.quotes[it.quotes.length - 1] : "";
        h += `<div class="pref ${rejected ? "rejected" : ""}" data-pid="${esc(it.id)}">
          <p class="s">${esc(it.statement)} <span class="pill ${esc(it.confidence)}">${esc(it.confidence)} · ${it.count}</span></p>
          ${quote ? `<blockquote>“${esc(quote)}”</blockquote>` : ""}
          <div class="btns">${rejected ? '<span class="meta">틀렸다고 표시함 · 다시 추론하지 않음</span>' : fb && fb.verdict === "right" ? '<span class="meta">맞다고 표시함</span>' : `<button type="button" class="btn fb" data-verdict="right">맞아</button><button type="button" class="btn danger fb" data-verdict="wrong">틀렸어</button>`}</div>
        </div>`;
      }
      h += "</details>";
    }
    h += "</div></section>";
    return h;
  }

  // ---------- events ----------
  function bind() {
    document.querySelectorAll(".act").forEach((b) => b.addEventListener("click", onResolve));
    document.querySelectorAll(".mood").forEach((b) => b.addEventListener("click", () => { state.draft.mood = state.draft.mood === b.dataset.mood ? null : b.dataset.mood; render(); }));
    const ta = $("log-text"); if (ta) ta.addEventListener("input", () => { state.draft.text = ta.value; });
    const sel = $("log-cat"); if (sel) sel.addEventListener("change", () => { state.draft.category = sel.value; });
    const save = $("log-save"); if (save) save.addEventListener("click", onSaveLog);
    document.querySelectorAll(".fb").forEach((b) => b.addEventListener("click", onFeedback));
    document.querySelectorAll("details.cat").forEach((d) => d.addEventListener("toggle", () => { if (d.open) state.openCat = d.dataset.cat; }));
  }
  for (const t of ["today", "log", "profile"]) $("tab-" + t).addEventListener("click", () => { state.tab = t; try { localStorage.setItem("secretary.tab", t); } catch (e) {} render(); });

  async function onResolve(ev) {
    const card = ev.currentTarget.closest("[data-id]"); const id = card.dataset.id; const status = ev.currentTarget.dataset.status;
    if (!state.db || state.busy.has(id)) return;
    state.busy.add(id); render();
    try {
      await state.db.doc("suggestions/" + id).update({ status, resolved_at: nowIso(), note: status === "expired" ? "폰에서 '나중에'" : null });
      toast(status === "accepted" ? "비서가 다음 세션에서 실행해요" : status === "declined" ? "다시 제안하지 않을게요" : "보류했어요");
    } catch (e) { toast("저장 실패: " + (e && e.code ? e.code : "unavailable")); }
    state.busy.delete(id); render();
  }
  async function onSaveLog() {
    const text = state.draft.text.trim();
    if (!text && !state.draft.mood) { toast("기분이나 한 줄을 남겨 주세요"); return; }
    if (!state.db) return;
    const btn = $("log-save"); btn.disabled = true;
    try {
      await state.db.collection("logs").add({ at: nowIso(), text, mood: state.draft.mood, category: state.draft.category });
      state.draft = { mood: null, category: state.draft.category, text: "" };
      toast("남겼어요");
    } catch (e) { toast("저장 실패: " + (e && e.code ? e.code : "unavailable")); }
    render();
  }
  async function onFeedback(ev) {
    const pid = ev.currentTarget.closest("[data-pid]").dataset.pid; const verdict = ev.currentTarget.dataset.verdict;
    if (!state.db) return;
    ev.currentTarget.disabled = true;
    try {
      await state.db.collection("feedback").add({ profile_id: pid, verdict, at: nowIso(), note: null });
      state.feedback[pid] = { verdict };
      toast(verdict === "wrong" ? "다음 동기화 때 지울게요" : "고마워요");
    } catch (e) { toast("저장 실패: " + (e && e.code ? e.code : "unavailable")); }
    render();
  }

  // ---------- data ----------
  async function boot() {
    render();
    const db = window.claude && window.claude.use ? await window.claude.use("db") : null;
    if (!db) { state.dbState = "none"; render(); return; }
    state.db = db; state.dbState = "ready";
    const onErr = (e) => { if (e && e.code === "revoked") { state.dbState = "none"; render(); } };
    db.doc("profile/current").onSnapshot((snap) => { state.profile = snap.exists ? snap.data() : null; render(); }, onErr);
    db.collection("suggestions").orderBy("created_at", "desc").limit(60).onSnapshot((q) => { state.suggestions = q.docs.map((d) => Object.assign({ id: d.id }, d.data())); render(); }, onErr);
    db.collection("briefs").orderBy("date", "desc").limit(7).onSnapshot((q) => { state.briefs = q.docs.map((d) => d.data()); render(); }, onErr);
    db.collection("logs").orderBy("at", "desc").limit(30).onSnapshot((q) => { state.logs = q.docs.map((d) => d.data()); render(); }, onErr);
    db.collection("feedback").orderBy("at", "desc").limit(200).onSnapshot((q) => {
      const fb = {}; for (const d of q.docs.slice().reverse()) { const x = d.data(); fb[x.profile_id] = { verdict: x.verdict }; }
      state.feedback = fb; render();
    }, onErr);
    render();
  }
  boot();
})();
</script>
