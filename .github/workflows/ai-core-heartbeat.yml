# 30분마다 모든 서버를 깨우고(무료 서버의 잠들기 방지) 자율 작업을 재촉한다.
# 필요한 저장소 Secrets: AI_NODE_URLS (쉼표로 구분한 서버 주소들), AI_OWNER_TOKEN
# 참고: GitHub 예약 실행은 기본 브랜치(main)에 있는 워크플로만 동작한다.
name: ai-core 깨우기
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - name: 서버 깨우기
        env:
          URLS: ${{ secrets.AI_NODE_URLS }}
          TOKEN: ${{ secrets.AI_OWNER_TOKEN }}
        run: |
          if [ -z "$URLS" ]; then echo "AI_NODE_URLS 가 설정되지 않음 - 건너뜀"; exit 0; fi
          IFS=',' read -ra NODES <<< "$URLS"
          for url in "${NODES[@]}"; do
            url="${url%/}"
            echo "== $url"
            curl -fsS -m 60 "$url/health" || echo "응답 없음"
            curl -fsS -m 30 -X POST "$url/tick" -H "Authorization: Bearer $TOKEN" || true
            echo
          done
