<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>BT Battery Overlay 설정</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <div class="titlebar">
    <div class="t"><img src="../../assets/icon.png" alt="">BT Battery Overlay 설정</div>
    <button class="wb" id="wb-min" title="최소화"></button>
    <button class="wb close" id="wb-close" title="닫기"></button>
  </div>
  <div class="content">
    <section>
      <h2>표시할 장치 <span class="sp"></span>
        <button class="btn" id="btn-refresh" title="장치 목록 새로고침"></button>
      </h2>
      <div class="devices" id="devices"></div>
      <p class="hint" id="dev-hint"></p>
      <div class="err" id="err"></div>
      <div class="row">
        <label class="l">연결 끊긴 장치도 표시<small>페어링만 된 장치를 흐리게 표시</small></label>
        <label class="switch"><input type="checkbox" data-key="showDisconnected"><span></span></label>
      </div>
      <div class="row">
        <label class="l">배터리 정보 없는 장치도 표시<small>Windows에 배터리를 보고하지 않는 장치(일부 키보드/마우스)</small></label>
        <label class="switch"><input type="checkbox" data-key="showNoBattery"><span></span></label>
      </div>
    </section>

    <section>
      <h2>모양</h2>
      <div class="row">
        <label class="l">배경 투명도<small>패널 배경의 불투명도</small></label>
        <input type="range" min="0" max="100" step="1" data-key="opacity" data-scale="100">
        <span class="v" id="v-opacity"></span>
      </div>
      <div class="row">
        <label class="l">전체 투명도<small>글자를 포함한 창 전체</small></label>
        <input type="range" min="20" max="100" step="1" data-key="textOpacity" data-scale="100">
        <span class="v" id="v-textOpacity"></span>
      </div>
      <div class="row">
        <label class="l">테마</label>
        <select data-key="theme"><option value="dark">다크</option><option value="light">라이트</option></select>
      </div>
      <div class="row">
        <label class="l">강조색</label>
        <input type="color" data-key="accent">
      </div>
      <div class="row">
        <label class="l">컴팩트 모드<small>한 줄로 간단히 표시</small></label>
        <label class="switch"><input type="checkbox" data-key="compact"><span></span></label>
      </div>
    </section>

    <section>
      <h2>동작</h2>
      <div class="row">
        <label class="l">새로고침 주기</label>
        <select data-key="refreshSec" data-type="number">
          <option value="15">15초</option><option value="30">30초</option><option value="60">1분</option>
          <option value="120">2분</option><option value="300">5분</option>
        </select>
      </div>
      <div class="row">
        <label class="l">항상 위에 표시</label>
        <label class="switch"><input type="checkbox" data-key="alwaysOnTop"><span></span></label>
      </div>
      <div class="row">
        <label class="l">위치 잠금<small>드래그로 이동 불가</small></label>
        <label class="switch"><input type="checkbox" data-key="locked"><span></span></label>
      </div>
      <div class="row">
        <label class="l">클릭 통과<small>오버레이가 마우스를 무시 (트레이 메뉴에서 해제)</small></label>
        <label class="switch"><input type="checkbox" data-key="clickThrough"><span></span></label>
      </div>
      <div class="row">
        <label class="l">배터리 부족 알림</label>
        <input type="number" min="5" max="60" step="5" data-key="lowThreshold" data-type="number"> <span class="v">% 이하</span>
        <label class="switch"><input type="checkbox" data-key="notifyLow"><span></span></label>
      </div>
      <div class="row">
        <label class="l">Windows 시작 시 자동 실행</label>
        <label class="switch"><input type="checkbox" data-key="autoStart"><span></span></label>
      </div>
    </section>

    <section>
      <h2>기타</h2>
      <div class="footer">
        <button class="btn" id="btn-bt">Windows Bluetooth 설정 열기</button>
        <button class="btn danger" id="btn-clear">예상 시간 기록 초기화</button>
        <button class="btn" id="btn-diag" title="장치 트리 원본 데이터를 클립보드에 복사합니다. 배터리가 안 보일 때 공유해 주세요.">진단 정보 복사</button>
        <span class="sp"></span>
        <span class="ver" id="ver"></span>
      </div>
      <p class="hint">남은 예상 시간은 배터리 % 변화를 시간에 따라 기록해 계산합니다. 사용 후 10분 이상, 2% 이상 소모되어야 표시되며 쓸수록 정확해집니다.</p>
      <div class="footer" style="margin-top:10px">
        <span class="sp"></span>
        <button class="btn danger" id="btn-quit">프로그램 종료</button>
      </div>
    </section>
  </div>
  <script src="common.js"></script>
  <script src="settings.js"></script>
</body>
</html>
